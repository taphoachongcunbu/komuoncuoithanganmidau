<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Thu Chi Đám Mây ☁️</title>
    <!-- Font, Icons & Chart.js -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Khu vực thông báo (Toast) -->
    <div id="toast-container"></div>

    <header>
        <div class="logo"><i class="fa-solid fa-wallet"></i> Sổ Thu Chi</div>
        <div class="header-actions">
            <button id="theme-toggle" class="icon-btn"><i class="fa-solid fa-moon"></i></button>
            <button id="login-btn" class="btn-primary">Đăng nhập</button>
            <button id="logout-btn" class="icon-btn" style="display: none;"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </header>

    <div id="login-message">
        <img src="https://cdn-icons-png.flaticon.com/512/2953/2953536.png" alt="Wallet" width="100">
        <h2>Quản lý tài chính thông minh</h2>
        <p>Đăng nhập để đồng bộ dữ liệu trên Cloud</p>
    </div>

    <main id="app-content" style="display: none;">
        <!-- Smart Assistant (Chatbot nhập nhanh) -->
        <div class="smart-input-container">
            <i class="fa-solid fa-robot"></i>
            <input type="text" id="smart-input" placeholder="Gõ nhanh: 'chi 50k ăn sáng' hoặc 'thu 2tr lương'...">
            <button id="btn-smart-submit"><i class="fa-solid fa-paper-plane"></i></button>
        </div>

        <nav class="tabs">
            <button class="tab-btn active" data-target="overview">Tổng quan</button>
            <button class="tab-btn" data-target="income">Thu / Chi</button>
            <button class="tab-btn" data-target="debt">Sổ Nợ</button>
            <button class="tab-btn" data-target="wishlist">Wishlist</button>
        </nav>

        <!-- TỔNG QUAN -->
        <section id="overview" class="tab-content active">
            <div class="budget-section">
                Hạn mức tháng này: <input type="number" id="budget-limit" placeholder="VD: 5000000"> đ
                <button id="save-budget" class="btn-small">Lưu</button>
            </div>
            <div id="budget-warning" class="warning-alert" style="display:none;"></div>
            
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>

            <div class="summary-cards">
                <div class="card thu">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                    <h3>Tổng Thu</h3>
                    <p id="total-income">0 đ</p>
                </div>
                <div class="card chi">
                    <i class="fa-solid fa-arrow-trend-down"></i>
                    <h3>Tổng Chi</h3>
                    <p id="total-expense">0 đ</p>
                </div>
            </div>
        </section>

        <!-- THU / CHI THỦ CÔNG (Gộp chung giao diện cho gọn) -->
        <section id="income" class="tab-content">
            <div class="form-group-split">
                <div class="form-box">
                    <h3><i class="fa-solid fa-plus-circle"></i> Nhập Thu</h3>
                    <form id="income-form">
                        <input type="number" id="income-amount" placeholder="Số tiền" required>
                        <select id="income-source">
                            <option value="Lương">Lương</option>
                            <option value="Thưởng">Thưởng</option>
                            <option value="Khác">Khác</option>
                        </select>
                        <button type="submit" class="btn-primary">Lưu Thu</button>
                    </form>
                </div>
                <div class="form-box">
                    <h3><i class="fa-solid fa-minus-circle"></i> Nhập Chi</h3>
                    <form id="expense-form">
                        <input type="number" id="expense-amount" placeholder="Số tiền" required>
                        <select id="expense-category">
                            <option value="Ăn uống">Ăn uống 🍔</option>
                            <option value="Di chuyển">Di chuyển 🛵</option>
                            <option value="Mua sắm">Mua sắm 🛍️</option>
                            <option value="Giải trí">Giải trí 🎬</option>
                            <option value="Khác">Khác</option>
                        </select>
                        <button type="submit" class="btn-danger">Lưu Chi</button>
                    </form>
                </div>
            </div>
            <!-- Chỗ này dùng để hiển thị danh sách lịch sử có thể Xóa -->
            <h3>Lịch sử gần đây</h3>
            <ul id="history-list" class="list-ui"></ul>
        </section>

        <!-- SỔ NỢ -->
        <section id="debt" class="tab-content">
            <form id="debt-form" class="inline-form">
                <select id="debt-type">
                    <option value="vay">Mình vay (Phải trả)</option>
                    <option value="cho_vay">Cho vay (Được đòi)</option>
                </select>
                <input type="number" id="debt-amount" placeholder="Số tiền" required>
                <input type="text" id="debt-person" placeholder="Tên người nợ" required>
                <button type="submit" class="btn-primary">Ghi nợ</button>
            </form>
            <div class="debt-split">
                <div class="debt-col">
                    <h4 style="color: #e74c3c;">Cần trả</h4>
                    <ul id="list-vay" class="list-ui"></ul>
                </div>
                <div class="debt-col">
                    <h4 style="color: #27ae60;">Cần đòi</h4>
                    <ul id="list-cho-vay" class="list-ui"></ul>
                </div>
            </div>
        </section>

        <!-- WISHLIST -->
        <section id="wishlist" class="tab-content">
            <form id="wishlist-form" class="inline-form">
                <input type="text" id="wish-name" placeholder="Tên món đồ" required>
                <input type="number" id="wish-price" placeholder="Giá tiền (để nhẩm tính)">
                <input type="url" id="wish-image" placeholder="Link ảnh (Optional)">
                <input type="url" id="wish-link" placeholder="Link Shopee (Optional)">
                <select id="wish-priority">
                    <option value="1">🔥 Must have</option>
                    <option value="2">✨ Có cũng được</option>
                    <option value="3">🤷‍♀️ Chưa cần lắm</option>
                </select>
                <button type="submit" class="btn-primary">Thêm</button>
            </form>
            <div id="wishlist-grid" class="grid-ui"></div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
